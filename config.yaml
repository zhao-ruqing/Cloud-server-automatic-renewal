schedule:
  mode: expiry
  # Manual:  python main.py
  # Task:    python main.py --scheduled  (Windows task: SanfengCloudAutoRenew, every 2h)
  # After submit, if expiry still unchanged within this many hours before deadline → email once
  audit_warn_hours_before: 5

ai:
  api_base: "https://api.deepseek.com/v1"
  api_key_env: "DEEPSEEK_API_KEY"
  model: "deepseek-v4-flash"
  prompt_file: "prompts/article.txt"
  min_body_length: 500
  max_body_length: 3000
  max_retries: 5

zhihu:
  write_url: "https://zhuanlan.zhihu.com/write"
  login_url: "https://www.zhihu.com/signin?next=%2F"
  auth_state: "auth/zhihu_state.json"
  profile_dir: "zhihu_profile"
  publish_timeout_sec: 60
  before_publish_delay_sec: 2
  after_publish_delay_sec: 3
  keepalive_enabled: true
  keepalive_interval_hours: 2
  keepalive_state_file: "data/zhihu_keepalive.json"
  relogin_poll_sec: 20
  relogin_email_interval_minutes: 10
  relogin_wait_max_hours: 12
  relogin_state_file: "data/zhihu_relogin.json"

cnblogs:
  login_url: "https://account.cnblogs.com/signin?returnUrl=https:%2F%2Fi.cnblogs.com%2Farticles%2Fedit"
  edit_url: "https://i.cnblogs.com/articles/edit"
  auth_state: "auth/cnblogs_state.json"
  profile_dir: "cnblogs_profile"
  username_env: "CNBLOGS_USERNAME"
  password_env: "CNBLOGS_PASSWORD"
  login_wait_sec: 3
  publish_timeout_sec: 60
  after_publish_delay_sec: 2

sanfeng:
  enabled: true
  fill_form: true
  submit_form: true
  login_url: "https://www.sanfengyun.com/login/"
  server_url: "https://www.sanfengyun.com/control/#/freeServer/532218"
  auth_state: "auth/sanfeng_state.json"
  profile_dir: "sanfeng_profile"
  state_file: "data/sanfeng_schedule.json"
  username_env: "SANFENG_USERNAME"
  password_env: "SANFENG_PASSWORD"
  run_hours_before_min: 0
  run_hours_before_max: 26
  login_wait_sec: 2
  form_load_wait_sec: 3
  expiry_load_timeout_sec: 30
  pause_before_close_sec: 5
  content:
    brand_name: "三丰云"
    brand_obfuscated: "三丰云"
    brand_server_obfuscated: "三丰云服务器"
    topics:
      - "Linux 部署"
      - "Nginx 反代"
      - "Python 服务托管"
    # Keep brand topic for renewal; add tech topics so the post looks less like pure promo.
    zhihu_topics:
      - "Linux"
      - "服务器"
      - "三丰云服务器"
    required_keywords:
      - "三丰云服务器"
      - "免费云服务器"

sanfeng2:
  enabled: true
  fill_form: true
  submit_form: true
  login_url: "https://www.sanfengyun.com/login/"
  server_url: "https://www.sanfengyun.com/control/#/freeServer/532941"
  auth_state: "auth/sanfeng2_state.json"
  profile_dir: "sanfeng_profile"
  state_file: "data/sanfeng2_schedule.json"
  username_env: "SANFENG2_USERNAME"
  password_env: "SANFENG2_PASSWORD"
  run_hours_before_min: 0
  run_hours_before_max: 26
  login_wait_sec: 2
  form_load_wait_sec: 3
  expiry_load_timeout_sec: 30
  pause_before_close_sec: 5
  content:
    brand_name: "三丰云"
    brand_obfuscated: "三丰云"
    brand_server_obfuscated: "三丰云服务器"
    topics:
      - "Docker"
      - "systemd"
      - "运维踩坑"
    zhihu_topics:
      - "Docker"
      - "运维"
      - "三丰云服务器"
    required_keywords:
      - "三丰云服务器"
      - "免费云服务器"

browser:
  headless: false
  slow_mo: 100
  # If this path is missing, the script auto-detects Chrome / Edge.
  executable_path: "C:\\Program Files\\Google\\Chrome\\Application\\chrome.exe"
  args:
    - "--disable-blink-features=AutomationControlled"
  viewport:
    width: 1280
    height: 900
  viewport_jitter:
    width: 80
    height: 60
  viewport_min:
    width: 1180
    height: 820

output:
  base_dir: "output"

logging:
  # Monthly dir + daily file: logs/2026-09/run_2026-09-17.log
  file: "logs/{year_month}/run_{date}.log"

notification:
  email:
    enabled: true
    smtp_host: "smtp.163.com"
    smtp_port: 465
    use_ssl: true
    username_env: "SMTP_USERNAME"
    password_env: "SMTP_PASSWORD"
    to_env: "NOTIFY_EMAIL_TO"
