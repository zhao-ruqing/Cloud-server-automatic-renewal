schedule:
  mode: expiry
  # Manual:  python main.py
  # Task:    python main.py --scheduled  (Windows task: SanfengCloudAutoRenew, every 2h)

ai:
  api_base: "https://api.deepseek.com/v1"
  api_key_env: "DEEPSEEK_API_KEY"
  model: "deepseek-v4-flash"
  prompt_file: "prompts/article.txt"
  min_body_length: 500
  max_body_length: 1000
  max_retries: 3

zhihu:
  write_url: "https://zhuanlan.zhihu.com/write"
  auth_state: "auth/zhihu_state.json"
  profile_dir: "zhihu_profile"
  publish_timeout_sec: 60
  before_publish_delay_sec: 2
  after_publish_delay_sec: 3
  keepalive_enabled: false
  keepalive_interval_hours: 2
  keepalive_state_file: "data/zhihu_keepalive.json"

cnblogs:
  login_url: "https://account.cnblogs.com/signin?returnUrl=https:%2F%2Fi.cnblogs.com%2Farticles%2Fedit"
  edit_url: "https://i.cnblogs.com/articles/edit"
  auth_state: "auth/cnblogs_state.json"
  profile_dir: "cnblogs_profile"
  username_env: "CNBLOGS_USERNAME"
  password_env: "CNBLOGS_PASSWORD"
  login_wait_sec: 3
  publish_timeout_sec: 60
  after_publish_delay_sec: 2

sanfeng:
  enabled: true
  fill_form: true
  submit_form: true
  login_url: "https://www.sanfengyun.com/login/"
  server_url: "https://www.sanfengyun.com/control/#/freeServer/532218"
  auth_state: "auth/sanfeng_state.json"
  profile_dir: "sanfeng_profile"
  state_file: "data/sanfeng_schedule.json"
  run_hours_before_min: 10
  run_hours_before_max: 23
  login_wait_sec: 2
  form_load_wait_sec: 3
  pause_before_close_sec: 5
  content:
    brand_name: "三丰云"
    brand_obfuscated: "三\\丰\\云"
    brand_server_obfuscated: "三\\丰\\云\\服\\务\\器"
    topics:
      - "云服务器"
      - "Linux部署"
    required_keywords:
      - "三\\丰\\云\\服\\务\\器"
      - "免费云服务器"

abeiyun:
  enabled: true
  fill_form: true
  submit_form: true
  login_url: "https://www.abeiyun.com/login/"
  server_url: "https://www.abeiyun.com/control/#/freeServer/1883838"
  auth_state: "auth/abeiyun_state.json"
  profile_dir: "abeiyun_profile"
  state_file: "data/abeiyun_schedule.json"
  run_hours_before_min: 10
  run_hours_before_max: 23
  login_wait_sec: 2
  form_load_wait_sec: 3
  pause_before_close_sec: 5
  content:
    brand_name: "阿贝云"
    brand_obfuscated: "阿\\贝\\云"
    brand_server_obfuscated: "阿\\贝\\云\\服\\务\\器"
    topics:
      - "云服务器"
      - "Docker"
    required_keywords:
      - "阿\\贝\\云\\服\\务\\器"
      - "免费云服务器"

browser:
  headless: false
  slow_mo: 100
  executable_path: "C:\\Program Files\\Google\\Chrome\\Application\\chrome.exe"
  args:
    - "--disable-blink-features=AutomationControlled"
  viewport:
    width: 1280
    height: 900
  viewport_jitter:
    width: 80
    height: 60
  viewport_min:
    width: 1180
    height: 820

output:
  base_dir: "output"

logging:
  # Daily file: logs/run_YYYY-MM-DD.log ({date} is replaced at runtime)
  file: "logs/run_{date}.log"

notification:
  email:
    enabled: true
    smtp_host: "smtp.163.com"
    smtp_port: 465
    use_ssl: true
    username_env: "SMTP_USERNAME"
    password_env: "SMTP_PASSWORD"
    to_env: "NOTIFY_EMAIL_TO"
