schedule:
  mode: expiry
  # Windows task: run `python main.py` every hour

ai:
  api_base: "https://api.deepseek.com/v1"
  api_key_env: "DEEPSEEK_API_KEY"
  model: "deepseek-v4-flash"
  prompt_file: "prompts/article.txt"
  min_body_length: 100
  max_body_length: 300
  max_retries: 3

zhihu:
  write_url: "https://zhuanlan.zhihu.com/write"
  auth_state: "auth/zhihu_state.json"
  profile_dir: "zhihu_profile"
  publish_timeout_sec: 60
  before_publish_delay_sec: 2
  after_publish_delay_sec: 3
  keepalive_enabled: true
  keepalive_interval_hours: 2
  keepalive_state_file: "data/zhihu_keepalive.json"

sanfeng:
  enabled: true
  fill_form: true
  submit_form: false
  login_url: "https://www.sanfengyun.com/login/"
  server_url: "https://www.sanfengyun.com/control/#/freeServer/532218"
  auth_state: "auth/sanfeng_state.json"
  profile_dir: "sanfeng_profile"
  state_file: "data/sanfeng_schedule.json"
  run_hours_before_min: 20
  run_hours_before_max: 22
  login_wait_sec: 2
  form_load_wait_sec: 3
  pause_before_close_sec: 30
  content:
    brand_name: "三丰云"
    topics:
      - "三丰云服务器"
    required_keywords:
      - "三丰云服务器"
      - "免费云服务器"

abeiyun:
  enabled: true
  fill_form: true
  submit_form: false
  login_url: "https://www.abeiyun.com/login/"
  server_url: "https://www.abeiyun.com/control/#/freeServer/1883838"
  auth_state: "auth/abeiyun_state.json"
  profile_dir: "abeiyun_profile"
  state_file: "data/abeiyun_schedule.json"
  run_hours_before_min: 20
  run_hours_before_max: 22
  login_wait_sec: 2
  form_load_wait_sec: 3
  pause_before_close_sec: 30
  content:
    brand_name: "阿贝云"
    topics:
      - "阿贝云服务器"
    required_keywords:
      - "阿贝云服务器"
      - "免费云服务器"

browser:
  headless: false
  slow_mo: 100
  executable_path: "C:\\Program Files\\Google\\Chrome\\Application\\chrome.exe"
  args:
    - "--disable-blink-features=AutomationControlled"
  viewport:
    width: 1280
    height: 900
  viewport_jitter:
    width: 80
    height: 60
  viewport_min:
    width: 1180
    height: 820

output:
  base_dir: "output"

logging:
  file: "logs/run.log"
